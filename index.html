<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MétéoInstant</title>
<meta name="theme-color" content="#1a1a2e">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="cursor" aria-hidden="true"></div>

<main class="app">
  <header class="top reveal">
    <h1>Météo<span>Instant</span></h1>
    <form id="search" autocomplete="off">
      <div class="search-field">
        <input id="q" type="search" placeholder="Rechercher une ville…" aria-label="Ville" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="citySuggestions">
        <ul id="citySuggestions" class="city-suggestions" role="listbox" aria-label="Villes suggérées" hidden></ul>
      </div>
      <button type="submit">Rechercher</button>
      <button type="button" id="geo" title="Ma position" aria-label="Utiliser ma position">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 10c0 5.2-8 12-8 12S4 15.2 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </form>
  </header>

  <p id="status" class="status" role="status"></p>

  <section id="current" class="card current tilt reveal" hidden>
    <div class="icon" id="icon"></div>
    <div class="info">
      <h2 id="place"></h2>
      <div class="temp"><span id="temp">--</span>°C</div>
      <p id="desc"></p>
    </div>
    <ul class="details">
      <li><small>Ressenti</small><b id="feel"></b></li>
      <li><small>Humidité</small><b id="hum"></b></li>
      <li><small>Vent</small><b id="wind"></b></li>
      <li><small>Pression</small><b id="pres"></b></li>
    </ul>
  </section>

  <section id="chartBox" class="card reveal" hidden>
    <div class="row">
      <h3>Évolution de la température</h3>
      <div class="tabs">
        <button class="on" data-mode="daily">7 jours</button>
        <button data-mode="hourly">48 heures</button>
      </div>
    </div>
    <div class="chart"><canvas id="chart"></canvas></div>
  </section>

  <section id="days" class="days"></section>

  <footer class="reveal">Données : <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (API REST gratuite, sans clé)</footer>
</main>
</body>
</html>
